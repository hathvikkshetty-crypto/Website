<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>People Tracker</title>
  <style>
    /* Color Variables */
    :root {
      --bg: #0f1512;
      --panel: #161f1a;
      --line: #2a362f;
      --ink: #eaf2ec;
      --sub: #8fa398;
      --accent: #ffb703;
      --danger: #ff6b6b;
      --good: #5fd68f;
    }

    /* Global Styles */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Courier New', ui-monospace, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Card Container */
    .card {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 28px;
    }

    /* Header Styles */
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 20px 0;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    /* Budget Input Section */
    .budget-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px dashed var(--line);
      padding: 10px 12px;
      border-radius: 3px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--sub);
    }

    .budget-row input {
      background: transparent;
      border: none;
      color: var(--accent);
      font-family: inherit;
      font-size: 14px;
      text-align: right;
      width: 120px;
      outline: none;
    }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    thead th {
      text-align: left;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sub);
      padding: 8px 8px;
      border-bottom: 1px solid var(--line);
    }

    tbody td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
    }

    tbody tr:hover {
      background: #101a14;
    }

    /* Table Input Fields */
    table input[type="text"],
    table input[type="number"] {
      background: #0c120f;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 8px 10px;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    table input:focus {
      border-color: var(--accent);
    }

    /* Column Widths */
    .col-num {
      width: 60px;
    }

    .col-amt,
    .col-rem {
      width: 120px;
    }

    .col-del {
      width: 36px;
    }

    /* Delete Button */
    .del-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }

    .del-btn:hover {
      opacity: 0.7;
    }

    /* Remaining Cell */
    .rem-cell {
      font-weight: 700;
    }

    .rem-cell.neg {
      color: var(--danger);
    }

    .rem-cell.pos {
      color: var(--good);
    }

    /* Add Button */
    .add-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #1a1400;
      border: none;
      border-radius: 3px;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.05em;
      cursor: pointer;
      text-transform: uppercase;
    }

    .add-btn:hover {
      background: #ffc733;
    }

    /* Totals Row */
    .totals-row {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--sub);
    }

    .totals-row .val {
      color: var(--ink);
      font-weight: 700;
    }

    /* Empty State */
    .empty {
      color: var(--sub);
      font-size: 13px;
      padding: 8px 0;
    }

    /* Mobile Responsive - Small screens (under 640px) */
    @media (max-width: 639px) {
      body {
        padding: 12px;
        min-height: auto;
      }

      .card {
        padding: 16px;
        max-width: 100%;
      }

      h1 {
        font-size: 18px;
        margin: 0 0 16px 0;
      }

      .eyebrow {
        font-size: 10px;
      }

      /* Budget row mobile */
      .budget-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 10px;
        margin-bottom: 16px;
      }

      .budget-row input {
        width: 100%;
        text-align: left;
        font-size: 16px;
      }

      /* Table mobile - Card layout */
      table {
        display: block;
        overflow-x: auto;
        margin-top: 8px;
      }

      thead {
        display: none;
      }

      tbody {
        display: block;
      }

      tbody tr {
        display: block;
        border: 1px solid var(--line);
        border-radius: 4px;
        margin-bottom: 12px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.02);
      }

      tbody tr:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      tbody td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        border: none;
        font-size: 14px;
      }

      tbody td::before {
        content: attr(data-label);
        font-weight: 700;
        color: var(--sub);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        min-width: 70px;
      }

      tbody td.col-num::before {
        content: "No.";
      }

      tbody td[data-label="Name"]::before {
        content: "Name";
      }

      tbody td.col-amt::before {
        content: "Amount";
      }

      tbody td.col-rem::before {
        content: "Remaining";
      }

      tbody td.col-del::before {
        content: "Del.";
      }

      tbody td input {
        flex: 1;
        margin-left: 8px;
      }

      /* Column widths mobile */
      .col-num,
      .col-amt,
      .col-rem,
      .col-del {
        width: 100%;
      }

      /* Delete button mobile */
      .del-btn {
        font-size: 20px;
        padding: 4px 8px;
      }

      /* Add button mobile */
      .add-btn {
        margin-top: 16px;
        padding: 14px;
        font-size: 13px;
      }

      /* Totals mobile */
      .totals-row {
        margin-top: 12px;
        padding-top: 10px;
        font-size: 12px;
      }
    }

    /* Tablet Responsive - Medium screens (640px to 1023px) */
    @media (min-width: 640px) and (max-width: 1023px) {
      .card {
        max-width: 100%;
        padding: 20px;
      }

      h1 {
        font-size: 20px;
      }

      .col-num {
        width: 50px;
      }

      .col-amt,
      .col-rem {
        width: 100px;
      }

      .budget-row input {
        width: 100px;
      }

      tbody td {
        padding: 5px 6px;
      }

      table input[type="text"],
      table input[type="number"] {
        padding: 6px 8px;
        font-size: 13px;
      }
    }

    /* Desktop Responsive - Large screens (1024px and up) */
    @media (min-width: 1024px) {
      .card {
        padding: 28px;
      }

      h1 {
        font-size: 22px;
      }

      .add-btn:hover {
        background: #ffc733;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="eyebrow">Ledger</div>
    <h1>People Tracker</h1>

    <!-- Budget Input -->
    <div class="budget-row">
      <span>Total budget</span>
      <input type="number" id="budget" value="10000" step="any">
    </div>

    <!-- People Table -->
    <table>
      <thead>
        <tr>
          <th class="col-num">No.</th>
          <th>Name</th>
          <th class="col-amt">Amount</th>
          <th class="col-rem">Remaining</th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <!-- Add Person Button -->
    <button class="add-btn" id="addBtn">+ Add person</button>

    <!-- Totals Summary -->
    <div class="totals-row">
      <span>Total amount</span>
      <span class="val" id="totalAmount">0</span>
    </div>
    <div class="totals-row">
      <span>Total remaining</span>
      <span class="val" id="totalRemaining">0</span>
    </div>
  </div>

  <script>
    // DOM Elements
    const budgetEl = document.getElementById('budget');
    const rowsEl = document.getElementById('rows');
    const addBtn = document.getElementById('addBtn');
    const totalAmountEl = document.getElementById('totalAmount');
    const totalRemainingEl = document.getElementById('totalRemaining');

    // Data
    let people = [];
    let nextId = 1;

    /**
     * Format number as currency with locale
     * @param {number} n - Number to format
     * @returns {string} Formatted number
     */
    function fmt(n) {
      return Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    /**
     * Add a new person to the list
     */
    function addPerson() {
      people.push({ id: nextId++, name: '', amount: 0 });
      render();
    }

    /**
     * Remove a person from the list by ID
     * @param {number} id - Person ID to remove
     */
    function removePerson(id) {
      people = people.filter(p => p.id !== id);
      render();
    }

    /**
     * Update a person's field
     * @param {number} id - Person ID
     * @param {string} field - Field name (name or amount)
     * @param {*} value - New value
     */
    function updatePerson(id, field, value) {
      const p = people.find(p => p.id === id);
      if (!p) return;
      p[field] = field === 'amount' ? (parseFloat(value) || 0) : value;
      render();
    }

    /**
     * Render the entire table and update totals
     */
    function render() {
      const budget = parseFloat(budgetEl.value) || 0;

      // Render table rows
      if (people.length === 0) {
        rowsEl.innerHTML = '<tr><td colspan="5" class="empty">No people yet. Click "Add person" to start.</td></tr>';
      } else {
        rowsEl.innerHTML = people.map((p, i) => {
          const remaining = budget - p.amount;
          const remClass = remaining < 0 ? 'neg' : 'pos';
          return `
            <tr>
              <td class="col-num" data-label="No.">${i + 1}</td>
              <td data-label="Name"><input type="text" value="${p.name}" placeholder="Name" data-id="${p.id}" data-field="name"></td>
              <td class="col-amt" data-label="Amount"><input type="number" value="${p.amount}" step="any" data-id="${p.id}" data-field="amount"></td>
              <td class="rem-cell col-rem ${remClass}" data-label="Remaining">${fmt(remaining)}</td>
              <td class="col-del" data-label=""><button class="del-btn" data-del="${p.id}">×</button></td>
            </tr>
          `;
        }).join('');
      }

      // Update totals
      const totalAmount = people.reduce((sum, p) => sum + p.amount, 0);
      const totalRemaining = people.reduce((sum, p) => sum + (budget - p.amount), 0);
      totalAmountEl.textContent = fmt(totalAmount);
      totalRemainingEl.textContent = fmt(totalRemaining);

      // Attach input listeners
      rowsEl.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', e => {
          updatePerson(Number(e.target.dataset.id), e.target.dataset.field, e.target.value);
          requestAnimationFrame(() => {
            const el = rowsEl.querySelector(`input[data-id="${e.target.dataset.id}"][data-field="${e.target.dataset.field}"]`);
            if (el) {
              el.focus();
              el.setSelectionRange(el.value.length, el.value.length);
            }
          });
        });
      });

      // Attach delete listeners
      rowsEl.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', e => removePerson(Number(e.target.dataset.del)));
      });
    }

    // Event Listeners
    addBtn.addEventListener('click', addPerson);
    budgetEl.addEventListener('input', render);

    // Initialize with 20 empty rows
    for (let i = 0; i < 20; i++) {
      addPerson();
    }
  </script>
</body>
</html>
