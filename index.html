<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f5f1">
    <meta name="description" content="A thoughtful little space to plan your day and keep track of what matters.">
    <title>Today — Tidy</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #24251f;
            --muted: #85867d;
            --line: #eeede8;
            --paper: #fff;
            --canvas: #f6f5f1;
            --accent: #6257d9;
            --accent-dark: #5146c5;
            --accent-pale: #eeecff;
            --green: #4f9874;
            --shadow: 0 18px 50px rgb(45 43 32 / 7%);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 50% -25%, #e9e7ff 0, transparent 42rem),
                var(--canvas);
            -webkit-font-smoothing: antialiased;
        }

        button, input, select { font: inherit; }
        button { color: inherit; }
        .app { width: min(100% - 32px, 720px); margin: 0 auto; padding: 26px 0 52px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 38px; }
        .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 750; letter-spacing: -.04em; }
        .brand-mark {
            display: grid; width: 34px; height: 34px; place-items: center; border-radius: 12px;
            color: white; background: var(--accent);
        }
        .brand-mark svg { width: 19px; height: 19px; }
        .date-pill {
            display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px;
            border: 1px solid #e9e8e2; border-radius: 999px; color: #64655e;
            background: rgb(255 255 255 / 70%); font-size: 12px; font-weight: 650;
        }
        .date-pill svg { width: 15px; height: 15px; color: var(--accent); }
        .intro { margin-bottom: 25px; }
        .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(32px, 8vw, 43px); font-weight: 750; letter-spacing: -.065em; line-height: 1.08; }
        .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

        .progress-card {
            display: flex; align-items: center; justify-content: space-between; gap: 18px;
            margin-bottom: 18px; padding: 18px 19px; border: 1px solid rgb(255 255 255 / 85%);
            border-radius: 18px; background: rgb(255 255 255 / 72%);
        }
        .progress-copy { min-width: 0; }
        .progress-title { margin: 0; font-size: 13px; font-weight: 700; }
        .progress-note { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
        .progress-track { height: 6px; margin-top: 12px; overflow: hidden; border-radius: 8px; background: #eeedf2; }
        .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #766bea, #a49bf6); transition: width .25s ease; }
        .progress-ring {
            display: grid; flex: 0 0 48px; width: 48px; height: 48px; place-items: center;
            border-radius: 50%; color: var(--accent); background: conic-gradient(var(--accent) 0deg, #eae9f3 0deg);
        }
        .progress-ring-inner { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 50%; background: var(--paper); font-size: 11px; font-weight: 750; }

        .task-card { padding: 20px 16px 8px; border: 1px solid rgb(255 255 255 / 85%); border-radius: 22px; background: var(--paper); box-shadow: var(--shadow); }
        .add-form { display: flex; flex-direction: column; gap: 9px; }
        .input-wrap { display: flex; min-height: 50px; align-items: center; gap: 10px; padding: 0 13px; border: 1px solid #eae9e4; border-radius: 13px; background: #fff; transition: border-color .18s, box-shadow .18s; }
        .input-wrap:focus-within { border-color: #aaa4f0; box-shadow: 0 0 0 3px rgb(98 87 217 / 10%); }
        .input-plus { display: grid; flex: 0 0 23px; width: 23px; height: 23px; place-items: center; border-radius: 7px; color: var(--accent); background: var(--accent-pale); }
        .input-plus svg { width: 15px; height: 15px; }
        .task-input { width: 100%; min-width: 0; padding: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 14px; }
        .task-input::placeholder { color: #a2a29c; }
        .add-button {
            display: inline-flex; min-height: 46px; align-items: center; justify-content: center; gap: 8px;
            padding: 0 17px; border: 0; border-radius: 12px; color: white; background: var(--accent);
            cursor: pointer; font-size: 13px; font-weight: 700; transition: background .18s, transform .18s;
        }
        .add-button:hover { background: var(--accent-dark); }
        .add-button:active { transform: scale(.98); }
        .add-button svg { width: 16px; height: 16px; }

        .list-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 1px 14px; }
        .list-heading h2 { margin: 0; font-size: 14px; font-weight: 750; letter-spacing: -.02em; }
        .task-count { margin-left: 5px; color: var(--muted); font-size: 12px; font-weight: 550; }
        .clear-button { padding: 6px 0 6px 8px; border: 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 11px; font-weight: 650; }
        .clear-button:hover { color: #c04d54; }
        .filters { display: flex; gap: 7px; margin-bottom: 9px; overflow-x: auto; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-button { flex: 0 0 auto; padding: 8px 12px; border: 1px solid transparent; border-radius: 999px; color: #77786f; background: transparent; cursor: pointer; font-size: 11px; font-weight: 650; transition: .18s; }
        .filter-button:hover { color: var(--accent); background: #f7f6ff; }
        .filter-button[aria-pressed="true"] { border-color: #e6e3ff; color: var(--accent); background: var(--accent-pale); }

        .task-list { margin: 0; padding: 0; list-style: none; }
        .task-row { display: flex; align-items: center; gap: 12px; min-height: 67px; padding: 11px 5px; border-bottom: 1px solid var(--line); animation: appear .2s ease both; }
        .task-row:last-child { border-bottom: 0; }
        @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .check-button { display: grid; flex: 0 0 21px; width: 21px; height: 21px; place-items: center; padding: 0; border: 1.5px solid #d6d6cf; border-radius: 7px; background: white; cursor: pointer; transition: .18s; }
        .check-button:hover { border-color: var(--accent); }
        .check-button svg { width: 13px; height: 13px; color: white; opacity: 0; transform: scale(.7); transition: .18s; }
        .task-row.is-done .check-button { border-color: var(--green); background: var(--green); }
        .task-row.is-done .check-button svg { opacity: 1; transform: scale(1); }
        .task-content { flex: 1; min-width: 0; }
        .task-title { display: block; overflow-wrap: anywhere; font-size: 13px; font-weight: 620; line-height: 1.4; transition: color .18s; }
        .task-row.is-done .task-title { color: #a2a39b; text-decoration: line-through; text-decoration-color: #bfc0b9; }
        .task-meta { display: flex; align-items: center; gap: 7px; margin-top: 5px; color: #999a92; font-size: 10px; }
        .category-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
        .category-dot.work { background: #e4a251; }
        .category-dot.personal { background: #df7c83; }
        .category-dot.wellbeing { background: #62a882; }
        .delete-button { display: grid; flex: 0 0 34px; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 10px; color: #aaa9a2; background: transparent; cursor: pointer; opacity: .72; transition: .18s; }
        .delete-button:hover, .delete-button:focus-visible { color: #c04d54; background: #fff2f1; opacity: 1; }
        .delete-button svg { width: 16px; height: 16px; }
        .empty-state { display: none; padding: 35px 10px 38px; text-align: center; }
        .empty-state.is-visible { display: block; }
        .empty-icon { display: grid; width: 47px; height: 47px; margin: 0 auto 12px; place-items: center; border-radius: 15px; color: var(--accent); background: #f1efff; }
        .empty-icon svg { width: 22px; height: 22px; }
        .empty-state h3 { margin: 0; font-size: 13px; font-weight: 700; }
        .empty-state p { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
        .footer-note { margin: 18px 0 0; color: #a2a29a; text-align: center; font-size: 11px; }
        button:focus-visible { outline: 3px solid rgb(98 87 217 / 35%); outline-offset: 2px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

        @media (min-width: 560px) {
            .app { width: min(100% - 48px, 620px); padding-top: 38px; }
            .topbar { margin-bottom: 48px; }
            .intro { margin-bottom: 29px; }
            .progress-card { padding: 20px 23px; }
            .task-card { padding: 24px 25px 10px; border-radius: 24px; }
            .add-form { flex-direction: row; }
            .input-wrap { flex: 1; }
            .add-button { min-width: 112px; }
            .list-heading { margin-top: 29px; }
            .task-row { min-height: 70px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <a class="brand" href="#" aria-label="Tidy home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none"><path d="m6 12.5 4 4L18.5 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 2.8a9.2 9.2 0 1 0 9.2 9.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                </span>
                <span>tidy</span>
            </a>
            <div class="date-pill">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M7.5 3v4M16.5 3v4M3.5 10h17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                <span id="today-date"></span>
            </div>
        </header>

        <section class="intro" aria-labelledby="page-title">
            <p class="eyebrow">Your little corner of calm</p>
            <h1 id="page-title">Make today<br>count<span style="color:var(--accent)">.</span></h1>
            <p class="subtitle">A clear mind starts with a clear list.</p>
        </section>

        <section class="progress-card" aria-label="Daily progress">
            <div class="progress-copy">
                <p class="progress-title" id="progress-title">A fresh start</p>
                <p class="progress-note" id="progress-note">Small steps add up. Pick one thing to begin.</p>
                <div class="progress-track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <div class="progress-ring" id="progress-ring" aria-hidden="true"><div class="progress-ring-inner" id="progress-percent">0%</div></div>
        </section>

        <section class="task-card" aria-labelledby="list-title">
            <form class="add-form" id="add-form">
                <label class="input-wrap" for="task-input">
                    <span class="input-plus" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </span>
                    <input class="task-input" id="task-input" name="task" type="text" maxlength="120" placeholder="What needs to get done?" autocomplete="off" required>
                </label>
                <button class="add-button" type="submit">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Add task
                </button>
            </form>

            <div class="list-heading">
                <h2 id="list-title">Your tasks <span class="task-count" id="task-count"></span></h2>
                <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
            </div>
            <nav class="filters" aria-label="Filter tasks">
                <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
                <button class="filter-button" type="button" data-filter="active" aria-pressed="false">In progress</button>
                <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
            </nav>
            <ul class="task-list" id="task-list" aria-live="polite"></ul>
            <div class="empty-state" id="empty-state">
                <div class="empty-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none"><path d="m5 12 4.2 4.2L19 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <h3 id="empty-title">All clear!</h3>
                <p id="empty-copy">A little breathing room looks good on you.</p>
            </div>
        </section>
        <p class="footer-note">One thing at a time. You’ve got this.</p>
    </main>

    <script>
        (() => {
            const storageKey = "tidy-tasks-v1";
            const starterTasks = [
                { id: "starter-1", title: "Plan the week ahead", category: "Personal", done: true },
                { id: "starter-2", title: "Finish the project proposal", category: "Work", done: false },
                { id: "starter-3", title: "Take a proper lunch break", category: "Wellbeing", done: false }
            ];
            const list = document.querySelector("#task-list");
            const form = document.querySelector("#add-form");
            const input = document.querySelector("#task-input");
            const emptyState = document.querySelector("#empty-state");
            const filters = document.querySelector(".filters");
            let activeFilter = "all";
            let tasks = loadTasks();

            function loadTasks() {
                try {
                    const stored = localStorage.getItem(storageKey);
                    if (stored === null) return starterTasks.map(task => ({ ...task }));
                    const parsed = JSON.parse(stored);
                    if (!Array.isArray(parsed) || !parsed.every(task =>
                        task && typeof task.id === "string" && typeof task.title === "string" &&
                        typeof task.done === "boolean" && typeof task.category === "string"
                    )) throw new Error("Saved task data has an invalid format.");
                    return parsed;
                } catch (error) {
                    console.error("Unable to load saved tasks.", error);
                    return starterTasks.map(task => ({ ...task }));
                }
            }

            function saveTasks() {
                try {
                    localStorage.setItem(storageKey, JSON.stringify(tasks));
                } catch (error) {
                    console.error("Unable to save tasks.", error);
                }
            }

            function icon(name) {
                if (name === "check") return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5.5 7l1 13h11l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            }

            function render() {
                const completed = tasks.filter(task => task.done).length;
                const total = tasks.length;
                const percent = total ? Math.round(completed / total * 100) : 0;
                const remaining = total - completed;
                document.querySelector("#task-count").textContent = `${remaining} left`;
                document.querySelector("#progress-percent").textContent = `${percent}%`;
                document.querySelector("#progress-fill").style.width = `${percent}%`;
                document.querySelector("#progress-ring").style.background =
                    `conic-gradient(var(--accent) ${percent * 3.6}deg, #eae9f3 ${percent * 3.6}deg)`;
                const progressBar = document.querySelector("#progress-bar");
                progressBar.setAttribute("aria-valuenow", String(percent));
                const progressTitle = document.querySelector("#progress-title");
                const progressNote = document.querySelector("#progress-note");
                if (total > 0 && remaining === 0) {
                    progressTitle.textContent = "Beautifully done!";
                    progressNote.textContent = "You made space for what matters today.";
                } else if (completed > 0) {
                    progressTitle.textContent = `${completed} ${completed === 1 ? "task" : "tasks"} down, ${remaining} to go`;
                    progressNote.textContent = "Keep that lovely momentum going.";
                } else {
                    progressTitle.textContent = "A fresh start";
                    progressNote.textContent = "Small steps add up. Pick one thing to begin.";
                }

                const visibleTasks = tasks.filter(task =>
                    activeFilter === "all" ||
                    (activeFilter === "active" && !task.done) ||
                    (activeFilter === "completed" && task.done)
                );
                list.replaceChildren();
                visibleTasks.forEach(task => {
                    const row = document.createElement("li");
                    row.className = `task-row${task.done ? " is-done" : ""}`;

                    const check = document.createElement("button");
                    check.type = "button";
                    check.className = "check-button";
                    check.setAttribute("aria-label", `${task.done ? "Mark as not done" : "Mark as done"}: ${task.title}`);
                    check.setAttribute("aria-pressed", String(task.done));
                    check.innerHTML = icon("check");
                    check.addEventListener("click", () => {
                        task.done = !task.done;
                        saveTasks();
                        render();
                    });

                    const content = document.createElement("div");
                    content.className = "task-content";
                    const title = document.createElement("span");
                    title.className = "task-title";
                    title.textContent = task.title;
                    const meta = document.createElement("span");
                    meta.className = "task-meta";
                    const dot = document.createElement("span");
                    dot.className = `category-dot ${task.category.toLowerCase()}`;
                    dot.setAttribute("aria-hidden", "true");
                    meta.append(dot, document.createTextNode(task.category));
                    content.append(title, meta);

                    const remove = document.createElement("button");
                    remove.type = "button";
                    remove.className = "delete-button";
                    remove.setAttribute("aria-label", `Delete task: ${task.title}`);
                    remove.innerHTML = icon("delete");
                    remove.addEventListener("click", () => {
                        tasks = tasks.filter(item => item.id !== task.id);
                        saveTasks();
                        render();
                    });

                    row.append(check, content, remove);
                    list.append(row);
                });

                const noTasks = visibleTasks.length === 0;
                emptyState.classList.toggle("is-visible", noTasks);
                list.hidden = noTasks;
                document.querySelector("#empty-title").textContent =
                    tasks.length === 0 ? "Nothing on your list yet" :
                    activeFilter === "completed" ? "Nothing completed just yet" : "All clear!";
                document.querySelector("#empty-copy").textContent =
                    tasks.length === 0 ? "Add a task above and make a little plan." :
                    activeFilter === "active" ? "You're all caught up. Enjoy the breathing room." :
                    activeFilter === "completed" ? "Finish a task and it will show up here." :
                    "A little breathing room looks good on you.";
            }

            form.addEventListener("submit", event => {
                event.preventDefault();
                const title = input.value.trim();
                if (!title) {
                    input.focus();
                    return;
                }
                tasks.unshift({
                    id: globalThis.crypto && typeof globalThis.crypto.randomUUID === "function"
                        ? globalThis.crypto.randomUUID()
                        : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
                    title,
                    category: "Personal",
                    done: false
                });
                activeFilter = "all";
                filters.querySelectorAll(".filter-button").forEach(button =>
                    button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter))
                );
                saveTasks();
                render();
                form.reset();
                input.focus();
            });

            filters.addEventListener("click", event => {
                const button = event.target.closest(".filter-button");
                if (!button) return;
                activeFilter = button.dataset.filter;
                filters.querySelectorAll(".filter-button").forEach(filterButton =>
                    filterButton.setAttribute("aria-pressed", String(filterButton === button))
                );
                render();
            });

            document.querySelector("#clear-completed").addEventListener("click", () => {
                tasks = tasks.filter(task => !task.done);
                saveTasks();
                render();
            });

            document.querySelector("#today-date").textContent = new Intl.DateTimeFormat("en", {
                weekday: "short", month: "short", day: "numeric"
            }).format(new Date());
            render();
        })();
    </script>
</body>
</html>
